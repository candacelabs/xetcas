[package]
name = "xetcasd"
version = "0.1.0"
description = "Self-hosted Xet CAS server with a Git smart-HTTP and Git LFS bridge."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "xetcasd"
path = "src/lib.rs"

[[bin]]
name = "xetcasd"
path = "src/main.rs"

[dependencies]
xet-core-structures = "=1.6.0"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
bytes = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = "0.4"
rand = "0.9"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xetcas-contracts = { path = "../xetcas-contracts" }

[dev-dependencies]
xet-client = "=1.6.0"
xet-data = "=1.6.0"
xet-runtime = "=1.6.0"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sha2 = "0.10"
tempfile = "3"
