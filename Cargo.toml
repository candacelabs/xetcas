[workspace]
members = ["crates/xetcas-contracts", "crates/xetcasd", "xtask"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/candacelabs/xetcas"
rust-version = "1.85"

[workspace.dependencies]
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
